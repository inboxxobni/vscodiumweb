# ── CI — Build VSCodium Web ───────────────────────────────────────────────────
#
# This workflow builds the reh-web (web server) component of VSCodium on every
# push and pull request, and publishes pre-built artifacts for easy deployment.
#
# The build:
# 1. Fetches the upstream VS Code source
# 2. Applies VSCodium patches and branding
# 3. Builds only the reh-web component (no Electron, no desktop GUI)
# 4. Packages the web server as a deployable archive
# ──────────────────────────────────────────────────────────────────────────────

name: CI - Build Web

on:
  push:
    branches:
      - master
      - insider
      - web-version
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      quality:
        description: 'Build quality (stable or insider)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - insider
      arch:
        description: 'Target architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64

env:
  APP_NAME: VSCodium
  BINARY_NAME: codium
  DISABLE_UPDATE: yes
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: linux
  VSCODE_QUALITY: ${{ inputs.quality || (github.ref == 'refs/heads/insider' && 'insider' || 'stable') }}
  VSCODE_ARCH: ${{ inputs.arch || 'x64' }}
  SHOULD_BUILD: yes
  MAX_OLD_SPACE_SIZE: 8192

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-22.04
    outputs:
      RELEASE_VERSION: ${{ steps.build.outputs.RELEASE_VERSION }}
      ARTIFACT_NAME: ${{ steps.package.outputs.ARTIFACT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libkrb5-dev jq git

      - name: Build VSCodium Web
        id: build
        run: |
          # Run the web build script
          ./build_web.sh 2>&1 | tee build.log

          # Extract release version from the output
          RELEASE_VERSION=$(grep -oP 'RELEASE_VERSION="\K[^"]+' build.log | head -1)
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_OUTPUT

          # Show build results
          echo "Build output:"
          ls -la web-build/

      - name: Package artifact
        id: package
        run: |
          # Find the packaged archive
          ARCHIVE=$(ls web-build/vscodium-web-*.tar.gz 2>/dev/null | head -1)
          if [[ -z "${ARCHIVE}" ]]; then
            echo "No archive found, creating one..."
            tar czf web-build/vscodium-web-linux-${VSCODE_ARCH}.tar.gz -C web-build server run.sh
            ARCHIVE="web-build/vscodium-web-linux-${VSCODE_ARCH}.tar.gz"
          fi

          ARTIFACT_NAME=$(basename "${ARCHIVE}" .tar.gz)
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Packaged: ${ARCHIVE}"

      - name: Upload web server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ARTIFACT_NAME }}
          path: web-build/
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  # Optional: Build and push Docker image
  docker:
    needs: build-web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/web-version')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.build-web.outputs.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=VSCodium Web — Browser-based editor without Electron
