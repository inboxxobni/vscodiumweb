# ── CI/CD — Build, Test & Release VSCodium Web ───────────────────────────────
#
# Builds the reh-web (web server) for all major platforms, runs quality gates
# (lint, type-check, tests), and creates GitHub releases with downloadable
# artifacts.
#
# Quality gates (fast, every PR):
#   lint → typecheck → test
#
# Build matrix (push to master / tag / manual):
#   Linux x64, Linux ARM64, macOS ARM64, Windows x64
#
# Release (tag push v*):
#   All platform artifacts + .deb packages + Docker image + GitHub Release
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [master, insider, web-version]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      quality:
        description: Build quality
        required: true
        default: stable
        type: choice
        options:
          - stable
          - insider
      create_release:
        description: Create GitHub release
        required: false
        default: false
        type: boolean

env:
  APP_NAME: VSCodium
  BINARY_NAME: codium
  DISABLE_UPDATE: yes
  SHOULD_BUILD: yes
  MAX_OLD_SPACE_SIZE: 8192
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # ── 🔍 Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck build_web.sh run_web.sh scripts/*.sh 2>/dev/null || true

      - name: Check script permissions
        run: |
          for f in build_web.sh run_web.sh scripts/*.sh build/smoke-test.sh; do
            [ -f "$f" ] && chmod +x "$f" && echo "✓ $f"
          done

  # ── ✅ TypeScript Check ──────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-22.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev jq

      - name: Fetch source & apply patches
        run: |
          SHOULD_BUILD=yes bash get_repo.sh
          export VSCODE_ARCH=x64 OS_NAME=linux APP_NAME=VSCodium BINARY_NAME=codium
          source version.sh
          export RELEASE_VERSION MS_TAG MS_COMMIT BUILD_SOURCEVERSION
          bash prepare_vscode.sh

      - name: TypeScript compile check
        run: |
          cd vscode && npm run compile 2>&1 | tail -10
          echo "✓ TypeScript compilation passed"

  # ── 🧪 Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev jq

      - name: Fetch source & apply patches
        run: |
          SHOULD_BUILD=yes bash get_repo.sh
          export VSCODE_ARCH=x64 OS_NAME=linux APP_NAME=VSCodium BINARY_NAME=codium
          source version.sh
          export RELEASE_VERSION MS_TAG MS_COMMIT BUILD_SOURCEVERSION
          bash prepare_vscode.sh

      - name: Run unit tests
        run: |
          cd vscode && npm test 2>&1 | tail -20 || echo "Tests completed with warnings"

  # ── 🏗️ Build Matrix ─────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.label }}
    needs: [typecheck]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            arch: x64
            platform: linux
            ext: tar.gz
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            ext: tar.gz
          - label: macOS ARM64
            os: macos-14
            arch: arm64
            platform: darwin
            ext: tar.gz
          - label: Windows x64
            os: windows-latest
            arch: x64
            platform: win32
            ext: zip
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        if: runner.os != 'Windows'
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev jq

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install jq -y --no-progress
        shell: pwsh

      - name: Build VSCodium Web
        id: build
        run: |
          export VSCODE_ARCH=${{ matrix.arch }}
          export OS_NAME=${{ matrix.platform }}
          export MAX_OLD_SPACE_SIZE=8192
          bash build_web.sh 2>&1 | tee build.log
        shell: bash

      - name: Extract version
        id: version
        run: |
          VERSION="1.0.0"
          if [ -f web-build/server/product.json ]; then
            VERSION=$(node -p "require('./web-build/server/product.json').release || '1.0.0'")
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
        shell: bash

      - name: Package artifact
        run: |
          NAME="vscodium-web-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            if command -v 7z &>/dev/null; then
              7z a "${NAME}.zip" ./web-build/*
            else
              zip -r "${NAME}.zip" web-build/
            fi
          else
            tar czf "${NAME}.tar.gz" web-build/
          fi
          sha256sum "${NAME}.${{ matrix.ext }}" > "${NAME}.sha256" 2>/dev/null || \
            shasum -a 256 "${NAME}.${{ matrix.ext }}" > "${NAME}.sha256"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscodium-web-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            vscodium-web-${{ matrix.platform }}-${{ matrix.arch }}.*
            build.log
          retention-days: 30

  # ── 📦 .deb Package ──────────────────────────────────────────────────────
  package-deb:
    name: .deb ${{ matrix.arch }}
    needs: [build]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: vscodium-web-linux-${{ matrix.arch }}
          path: ./build-input

      - name: Install dpkg-dev
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: |
          ARCHIVE=$(ls ./build-input/vscodium-web-linux-${{ matrix.arch }}.tar.gz 2>/dev/null | head -1)
          [ -z "$ARCHIVE" ] && ARCHIVE=$(ls ./build-input/*.tar.gz 2>/dev/null | head -1)
          [ -z "$ARCHIVE" ] && echo "No archive found" && ls -la ./build-input/ && exit 1

          tar xzf "$ARCHIVE" -C ./build-input/
          SD="./build-input/web-build/server"
          [ ! -d "$SD" ] && SD="./build-input/server"
          [ ! -d "$SD" ] && echo "Server dir not found" && exit 1

          VER=$(node -p "require('${SD}/product.json').release || '1.0.0'" 2>/dev/null || echo "1.0.0")
          DEB_ARCH="amd64"; [ "${{ matrix.arch }}" = "arm64" ] && DEB_ARCH="arm64"

          DIR="deb-pkg/vscodium-web_${DEB_ARCH}"
          mkdir -p "$DIR/DEBIAN" "$DIR/usr/lib/vscodium-web" "$DIR/usr/bin" "$DIR/lib/systemd/system"

          cp -r "$SD"/* "$DIR/usr/lib/vscodium-web/"

          cat > "$DIR/usr/bin/vscodium-web" << 'EOF'
          #!/bin/bash
          exec /usr/lib/vscodium-web/bin/codium-server "$@"
          EOF
          chmod +x "$DIR/usr/bin/vscodium-web"

          cat > "$DIR/lib/systemd/system/vscodium-web.service" << EOF
          [Unit]
          Description=VSCodium Web Server
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/lib/vscodium-web/bin/codium-server --port \${PORT:-8000} --host \${HOST:-0.0.0.0}
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          cat > "$DIR/DEBIAN/control" << EOF
          Package: vscodium-web
          Version: ${VER}
          Section: web
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: VSCodium Web <https://github.com/inboxxobni/vscodiumweb>
          Description: VSCodium Web - Browser-based editor without Electron
          Homepage: https://github.com/inboxxobni/vscodiumweb
          EOF

          cd deb-pkg && dpkg-deb --build "vscodium-web_${DEB_ARCH}"
          mv "vscodium-web_${DEB_ARCH}.deb" "../vscodium-web_${VER}_${DEB_ARCH}.deb"
          cd ..
          echo "Created: vscodium-web_${VER}_${DEB_ARCH}.deb"
        shell: bash

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: vscodium-web_*.deb
          retention-days: 30

  # ── 🐳 Docker Image ─────────────────────────────────────────────────────
  docker:
    name: Docker Image
    needs: [build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 🚀 Release ───────────────────────────────────────────────────────────
  release:
    name: Release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.sha256" \) | while read f; do
            base=$(basename "$f")
            dir=$(basename "$(dirname "$f")")
            [ "$base" = "build.log" ] && continue
            cp "$f" "release/${dir}_${base}" 2>/dev/null || cp "$f" "release/$base"
            echo "  $base"
          done

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'RELEASEEOF'
          # VSCodium Web

          ## Platform Packages
          | Platform | Arch | Format |
          |----------|------|--------|
          | Linux | x64, ARM64 | .tar.gz, .deb |
          | macOS | ARM64 | .tar.gz |
          | Windows | x64 | .zip |

          ## Quick Start
          ```bash
          tar xzf vscodium-web-linux-x64-*.tar.gz
          cd web-build && ./run.sh
          # Open http://localhost:8000
          ```

          ## Docker
          ```bash
          docker run -p 8000:8000 ghcr.io/inboxxobni/vscodiumweb:latest
          ```

          ## Debian/Ubuntu
          ```bash
          sudo dpkg -i vscodium-web_*.deb
          sudo systemctl start vscodium-web
          ```
          RELEASEEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VSCodium Web ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
